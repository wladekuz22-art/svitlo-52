<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Світло 5.2</title><style>
:root{color-scheme:dark;font-family:system-ui,Arial}body{background:#0d1728;color:#f1f5f9;margin:0}main{max-width:850px;margin:auto;padding:28px 18px}h1{font-size:32px;margin:6px 0}p{color:#a9b9ce}section{background:#19273b;border:1px solid #2b4059;border-radius:18px;padding:18px;margin:18px 0}img{max-width:100%;height:auto;border-radius:10px;background:white}a{color:#83c9ff}.tag{font-size:14px;color:#9fbed5}.error{color:#ffba9b}button{background:#2d79bd;border:0;border-radius:10px;color:white;padding:10px 16px;cursor:pointer}
</style></head><body><main><div class="tag">КИЇВСЬКА ОБЛАСТЬ · ЧЕРГА 5.2</div><h1>⚡ Світло 5.2</h1><p id="status">Очікуємо першої перевірки…</p><button onclick="load()">Оновити сторінку</button><section><h2>Сьогодні</h2><div id="today">Немає перевірених даних</div></section><section><h2>Завтра</h2><div id="tomorrow">Графік поки недоступний</div></section><p>Джерело: <a href="https://bezsvitla.com.ua/kyivska-oblast/cherha-5-2">Без світла</a>. Це орієнтовний графік, а не підтвердження фактичної наявності електроенергії.</p></main><script>
async function load(){try{let r=await fetch('data.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('Немає даних');let d=await r.json();document.getElementById('status').textContent=(d.status==='ok'?'Остання перевірка: ':'⚠️ Не вдалося оновити. Остання спроба: ')+(d.checked_at||'невідомо');for(let k of ['today','tomorrow']){let e=document.getElementById(k);if(d[k]){e.replaceChildren();let img=document.createElement('img');img.src=d[k].image+'?v='+d[k].hash;img.alt='Графік відключень '+k;e.append(img)}else e.textContent='Графік не опублікований або недоступний'}}catch(e){document.getElementById('status').textContent='Дані ще не завантажено. Спробуйте пізніше.'}}load();
</script></body></html>
